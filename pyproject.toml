[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicelink"
version = "0.1.0"
description = "Python SDK for VoiceLink telephony, with integrations for LiveKit, Pipecat, and Dograh."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VoiceLink SDK" }]
keywords = ["voicelink", "telephony", "sip", "voice-ai", "pipecat", "livekit", "dograh"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Telephony",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Framework adapters — installed on demand. The core never imports these.
# Pinned to the 1.x line: the serializer is written against Pipecat 1.7's FrameSerializer,
# which dropped FrameSerializerType and moved InputParams to pydantic. A 0.x install would
# not satisfy it, and 2.0 is expected to remove APIs 1.7 only deprecates.
# The ``websocket`` extra pulls in FastAPI, which the quickstart's bot and repeat modes
# need: they serve one WebSocket per call, and Pipecat's plain WebSocket server transport
# accepts only a single client at a time.
pipecat = ["pipecat-ai[websocket]>=1.7,<2", "uvicorn>=0.30"]
livekit = ["livekit-api>=1.2"]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["voicelink"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
